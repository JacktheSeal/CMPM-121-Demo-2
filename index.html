<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splatoon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <main id="app">
      <h1>Splatoon Planner</h1>
      <p>Plan Splatoon Strategies!</p>
      <canvas id="canvas" width="256" height="256"></canvas>

      <div id="functionDiv">
        <button id="clearButton">Clear ⌫</button>
        <button id="redrawButton">Redraw ✎</button>
        <button id="undoButton">← Undo</button>
        <button id="redoButton">Redo →</button>
        <button id="exportButton" type="button">Export PNG ↓</button>
      </div>

      <div id="colorDiv">
        <button id="blackButton">Black</button>
        <button id="yellowButton">Yellow</button>
        <button id="blueButton">Blue</button>
      </div>

      <div id="stampPalette"></div>

      <div>
        <form id="createStampForm">
          <input
            id="stampName"
            type="text"
            placeholder="Tool name"
          />

          <input
            id="stampContent"
            type="text"
            placeholder="Emoji or short text"
          />

          <button type="submit">Create tool</button>
          </div>
        </form>
        </main>
        <script type="module" src="/src/main.ts"></script>
        </body>
        </html>

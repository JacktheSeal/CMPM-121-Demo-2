<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2 project</title>
  </head>
  <body>
    <main id="app">
      <h1>D2 project</h1>
      <p>Your project starts here.</p>
      <canvas id="canvas" width="256" height="256"></canvas>

      <div id="functionDiv">
        <button id="clearButton">Clear</button>
        <button id="redrawButton">Redraw</button>
        <button id="undoButton">Undo</button>
        <button id="redoButton">Redo</button>
      </div>

      <div id="colorDiv">
        <button id="blackButton">Black</button>
        <button id="yellowButton">Yellow</button>
        <button id="blueButton">Blue</button>
      </div>

      <div id="stampPalette"></div>

      <form id="createStampForm">
        <input
          id="stampName"
          type="text"
          placeholder="Tool name"
        />

        <input
          id="stampContent"
          type="text"
          placeholder="Emoji or short text"
        />

        <button type="submit">Create tool</button>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
